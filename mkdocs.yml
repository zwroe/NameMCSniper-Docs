site_name: NameMCSniper Documentation
site_description: Guide to the Rust edition of NameMCSniper for Minecraft Java Edition
site_author: light & zwroe
site_url: https://zwroe.github.io/NameMCSniper-Docs/

# Repository
repo_name: NameMCSniper
repo_url: https://github.com/zwroe/NameMCSniper
edit_uri: ""

# Copyright
copyright: Copyright &copy; 2024 light & zwroe

# Configuration
theme:
  name: material
  logo: namemcsniperlogo.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Local files and settings: getting-started/configuration.md
    - Authentication: getting-started/authentication.md
  - Usage:
    - Schedule a rename: usage/basic-usage.md
    - Command Reference: usage/commands.md
    - Test proxies: usage/proxy-setup.md
  - Advanced:
    - How It Works: advanced/how-it-works.md
    - Sniping tips: advanced/performance.md
    - Troubleshooting: advanced/troubleshooting.md
  - Legal & Support:
    - Legal Notice: legal/legal-notice.md
    - Support: legal/support.md

not_in_nav: |-
  usage/discord-setup.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zwroe/NameMCSniper
